[project]
name = "ledger"
version = "0.1.0"
description = "The MCP server built chapter by chapter in MCP Servers: Zero to Hero"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.3,<5",
    "uvicorn>=0.34",
]

[project.scripts]
ledger = "ledger.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
